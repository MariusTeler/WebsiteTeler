{% extends "base.html" %}
{% block title %}{{ t.notfound.title }}{% endblock %}
{% block robots %}noindex{% endblock %}
{% block content %}
<section class="lost">
  <div class="wrap">
    <p class="lost-code" aria-hidden="true">404</p>
    <h1 class="lost-title">{{ t.notfound.heading }}</h1>
    <p class="lost-text">{{ t.notfound.text }}</p>
    <a class="btn btn-gold" href="{{ home }}"><span>{{ t.notfound.cta }}</span></a>
  </div>
</section>
{% endblock %}
