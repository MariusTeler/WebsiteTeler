{% set j = t.journey %}
{% set n = j.stops|length %}
<section class="journey" id="journey" data-journey style="--stops: {{ n }}">
  <div class="journey-sticky">
    <div class="wrap journey-head">
      <div>
        <h2 class="kicker">{{ j.kicker }}</h2>
        <p class="section-title">{{ j.title }}</p>
      </div>
      <p class="journey-count" aria-hidden="true"><span data-stop-index>1</span> {{ j.count.format(n=n) }}</p>
    </div>

    <div class="journey-map" aria-hidden="true">
      <svg viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid meet">
        <path class="jr-bg" d="M 40,130 C 170,40 270,190 410,115 S 640,30 780,110 S 990,185 1160,70"/>
        <path class="jr-fg" data-route d="M 40,130 C 170,40 270,190 410,115 S 640,30 780,110 S 990,185 1160,70"/>
        <g data-stop-dots></g>
        <g class="jr-parcel" data-parcel>
          <circle r="22" class="jr-parcel-halo"/>
          <rect x="-9" y="-9" width="18" height="18" rx="3"/>
          <path d="M -9,-2 H 9 M 0,-9 V -2" />
        </g>
      </svg>
    </div>

    <ol class="stops wrap" data-stops>
      {% for s in j.stops %}
      {% set year = stops_meta[loop.index0].year %}
      <li class="stop{% if loop.last %} is-now{% endif %}" data-year="{{ year }}">
        <span class="stop-year" aria-hidden="true">{{ year }}</span>
        <div class="stop-body">
          <p class="stop-when">{{ s.when }}</p>
          <h3 class="stop-role">{{ s.role }}</h3>
          <p class="stop-co">{{ s.co }}</p>
          <p class="stop-text">{{ s.text }}</p>
        </div>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
