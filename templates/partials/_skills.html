{% set icons = [
  '<circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.5a7 7 0 0 1 14 0V20"/>',
  '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>'
] %}
{% set e = t.expertise %}
<section class="expertise" id="expertise">
  <div class="wrap">
    <div class="expertise-head">
      <h2 class="kicker">{{ e.kicker }}</h2>
      <p class="section-title">{{ e.title }}</p>
    </div>

    <div class="areas">
      {% for a in e.areas %}
      <article class="area" data-spotlight>
        <div class="area-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{{ icons[loop.index0]|safe }}</svg>
        </div>
        <div class="area-main">
          <h3>{{ a.title }}</h3>
          <p>{{ a.line }}</p>
        </div>
        <ul class="area-items">
          {% for i in a.points %}<li>{{ i }}</li>{% endfor %}
        </ul>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
