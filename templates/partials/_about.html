{% set a = t.about %}
<section class="about" id="about">
  <div class="wrap">
    <h2 class="kicker">{{ a.kicker }}</h2>
    <p class="statement" data-words>{{ a.statement }}</p>

    <div class="about-grid">
      <div class="about-copy">
        {% for p in a.paragraphs %}<p>{{ p }}</p>{% endfor %}
      </div>

      <dl class="facts">
        {% for f in a.facts %}<div><dt>{{ f[0] }}</dt><dd>{{ f[1] }}</dd></div>{% endfor %}
      </dl>
    </div>
  </div>
</section>
